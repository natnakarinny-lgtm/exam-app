<title>คลังข้อสอบกฎหมายการคลัง</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* แนวคิด: แอพมือถือสีม่วงอ่อน มีตัวการ์ตูนรูปทรงประจำแต่ละวิชา การ์ดมนใหญ่ แตะง่าย */
:root{
  --bg:#f6f3fd; --card:#ffffff; --ink:#2a2147; --muted:#716a8c; --line:#e8e2f6;
  --brand:#7446e0; --brand-soft:#ece5fd; --on-brand:#ffffff;
  --good:#16936a; --good-soft:#dcf5ea; --bad:#d9486b; --bad-soft:#fde4ea; --warn:#a56a00; --sun-soft:#fff1d2;
  --shadow:0 6px 20px rgba(84,56,170,.1);
  --display:"Mitr","IBM Plex Sans Thai Looped",Tahoma,sans-serif; --body:"IBM Plex Sans Thai Looped","Noto Sans Thai",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132a; --card:#231d3b; --ink:#f0ecfb; --muted:#aca4c8; --line:#372e58;
  --brand:#a585f7; --brand-soft:#352a5e; --on-brand:#1b1533;
  --good:#5fd6ab; --good-soft:#1b3b34; --bad:#ff90aa; --bad-soft:#47243a; --warn:#f3c267; --sun-soft:#43361d;
  --shadow:0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17132a; --card:#231d3b; --ink:#f0ecfb; --muted:#aca4c8; --line:#372e58;
  --brand:#a585f7; --brand-soft:#352a5e; --on-brand:#1b1533;
  --good:#5fd6ab; --good-soft:#1b3b34; --bad:#ff90aa; --bad-soft:#47243a; --warn:#f3c267; --sun-soft:#43361d;
  --shadow:0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body)}
#app{max-width:520px;margin:0 auto;padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3,p{margin:0}
h1{font:600 26px/1.3 var(--display);text-wrap:balance}
h2{font:500 18px/1.35 var(--display)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.btn{border-radius:16px;padding:12px 20px;font:500 16px var(--display);background:var(--brand-soft);color:var(--brand);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--brand);color:var(--on-brand)}
.btn.wide{width:100%;padding:14px 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--brand);font:500 14px var(--body)}
.chip-s{display:inline-flex;align-items:center;gap:5px;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 15px var(--display)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero{background:linear-gradient(135deg,#7f52ea,#a988f5);color:#fff;border-radius:24px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center;overflow:hidden}
.hero-face{width:108px;height:108px;border-radius:50%;background:#fff;display:grid;place-items:center;justify-self:end}
.hero .eyebrow{font-size:13px;opacity:.9}
.hero h2{font-size:20px;margin:2px 0 10px}
.hero .btn{background:#fff;color:#5b34c9;padding:9px 16px;font-size:15px}
.track{height:9px;border-radius:9px;background:var(--brand-soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--brand);transition:width .3s}
.hero .track{background:rgba(255,255,255,.3);margin-bottom:10px}
.hero .track i{background:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{display:grid;justify-items:center;gap:6px;font-size:13px;line-height:1.3;text-align:center;padding:0}
.tile .ic{width:60px;height:60px;border-radius:20px;display:grid;place-items:center}
.tile:disabled{opacity:.45;cursor:not-allowed}
.list{display:grid;gap:10px}
.item{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:18px;padding:10px 14px 10px 10px;box-shadow:var(--shadow)}
.item .name{font-weight:600;line-height:1.35}
.item .track{height:6px;margin-top:6px}
.face{border-radius:16px;display:grid;place-items:center;flex:none;width:56px;height:56px}
.search{width:100%;border:0;background:var(--card);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pill{flex:none;border-radius:999px;padding:7px 15px;background:var(--card);font-size:15px;box-shadow:var(--shadow)}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:500}
.pill:disabled{opacity:.45;cursor:not-allowed}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.subject{border-radius:22px;padding:14px;text-align:left;display:grid;gap:6px;min-height:176px;align-content:start;color:#2a2147;transition:transform .12s}
.subject:active{transform:scale(.97)}
.subject .name{font:500 15px/1.35 var(--display)}
.subject .track{height:6px;background:rgba(255,255,255,.65)}
.subject .track i{background:#2a2147}
.detail{border-radius:26px;padding:20px;display:grid;justify-items:center;text-align:center;gap:8px;color:#2a2147}
.detail .track{width:100%;background:rgba(255,255,255,.65)}
.detail .track i{background:#2a2147}
.bubble{background:#fff;color:#2a2147;border-radius:16px;padding:6px 14px;font-size:14px;position:relative}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.field{display:grid;gap:8px}
.field>span{font:500 15px var(--display)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{background:var(--card);border-radius:18px;padding:14px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent}
.mode[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.mode b{display:block;font:500 16px var(--display)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:1px;padding:9px 0 8px;font-size:12px;color:var(--muted)}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.lesson-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.x{width:36px;height:36px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:18px;line-height:1}
.ask{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:end}
.say{background:var(--card);border-radius:20px 20px 20px 6px;padding:14px 16px;font:500 17px/1.6 var(--body);box-shadow:var(--shadow)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:11px 13px;transition:transform .1s}
.opt:not(:disabled):active{transform:scale(.98)}
.opt .k{width:38px;height:38px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:500 17px var(--display)}
.opt.pick{border-color:var(--brand);background:var(--brand-soft)} .opt.pick .k{background:var(--brand);color:var(--on-brand)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .k{background:var(--good);color:var(--card)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .k{background:var(--bad);color:var(--card)}
.opt:disabled{cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 28px rgba(40,20,100,.18);max-height:62%;overflow-y:auto}
.sheet.good{background:var(--good-soft)} .sheet.bad{background:var(--bad-soft)} .sheet.plain{background:var(--card)}
.sheet>div{max-width:488px;margin:0 auto;display:grid;gap:8px}
.sheet h2{font-size:20px}
.good-t{color:var(--good)} .bad-t{color:var(--bad)}
.tag{font-size:13px;color:var(--muted)} .tag.chk{color:var(--good)} .tag.un{color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.cell{border-radius:11px;background:var(--card);padding:6px 0;font-size:14px;box-shadow:var(--shadow)}
.cell.done{background:var(--brand);color:var(--on-brand)}
.cell.now{outline:2.5px solid #ffb020;outline-offset:1px}
.result{text-align:center;display:grid;justify-items:center;gap:6px;position:relative;overflow:hidden;padding-block:8px}
.stars{display:flex;gap:6px}
.score{font:600 44px/1.1 var(--display)}
.earn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.earn .card{padding:12px;text-align:center}
.earn b{display:block;font:600 22px/1.2 var(--display)}
.rev{display:grid;gap:5px}
.rev .ans{font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart text.v{fill:var(--ink);font-weight:600}
.chart line{stroke:var(--line)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.3}
.badge .m{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--sun-soft)}
.badge.off .m{background:var(--line);filter:grayscale(1);opacity:.55}
.badge.off{color:var(--muted)}
.prof{display:grid;justify-items:center;gap:6px;text-align:center}
.name-in{border:0;background:none;text-align:center;font:600 22px var(--display);width:100%}
.name-in::placeholder{color:var(--muted)}
.menu{display:grid}
.menu button{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left}
.menu>:last-child{border-bottom:0}
input[type=text].in,textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px}
textarea{min-height:220px;font-size:15px;line-height:1.6}
pre.fmt{margin:0;background:var(--brand-soft);border-radius:14px;padding:12px;font:400 14px/1.6 var(--body);white-space:pre-wrap}
.notice{padding:11px 14px;background:var(--brand-soft);border-radius:14px}
.choice{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.choice .k{width:44px;height:44px;border-radius:13px;background:var(--brand-soft);color:var(--brand);font:500 17px var(--display)}
.choice .k[aria-pressed="true"]{background:var(--good);color:var(--card)}
.law{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;font-size:14px}
.sheet .law{background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .sheet .law{background:rgba(0,0,0,.2)}
.law summary{cursor:pointer;color:var(--brand);font-weight:500}
.lawtxt{display:grid;gap:6px;margin-top:6px;line-height:1.7}
.lawtxt b{font-family:var(--display);font-weight:500}
.sec{scroll-margin-top:12px}
.sec p{margin:0 0 6px}
.sec.hit{outline:2px solid var(--brand);outline-offset:6px;border-radius:8px}
.rankcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%}
.rankcard .track{margin-top:6px}
.rk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px}
.rk.now{outline:2.5px solid var(--brand)}
.rk.off{opacity:.5}
.rk.off svg{filter:grayscale(1)}
.rankup{background:var(--sun-soft);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;font:500 16px var(--display)}
.mine{display:flex;align-items:center;gap:10px;padding:12px 14px}
.mine .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:370px){.tiles{gap:6px}.tile .ic{width:54px;height:54px}.hero{grid-template-columns:minmax(0,1fr) 92px}.hero-face{width:92px;height:92px}}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
  .wig{animation:wig .4s ease}
  .sheet{animation:up .2s ease-out}
  .conf{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.5s ease-in forwards}
  @keyframes pop{from{transform:scale(.7)}to{transform:none}}
  @keyframes wig{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
  @keyframes up{from{transform:translateY(40px)}to{transform:none}}
  @keyframes fall{to{transform:translateY(260px) rotate(320deg);opacity:0}}
}
@media (prefers-reduced-motion:reduce){.conf{display:none}}
</style>

<script>
// คำถามเขียนใหม่จากตัวบท ไม่ได้คัดลอกจากหนังสือ
// รูปแบบ: [คำถาม, คำตอบที่ถูก, [ตัวเลือกผิด 3 ข้อ], คำอธิบาย, อ้างอิง, หน้าหนังสือที่ตรวจเทียบแล้ว (0 = ยังไม่เทียบ)]
// เพิ่มข้อใหม่ต่อท้ายเท่านั้น เพราะรหัสข้อผูกกับลำดับ
const LAWS = [
{id:"tr",group:"การเงินการคลัง",name:"ระเบียบการเบิกเงินจากคลัง การรับเงิน การจ่ายเงิน การเก็บรักษาเงิน และการนำเงินส่งคลัง",short:"ระเบียบเบิกจ่ายเงินจากคลัง",year:"2562",qs:[
["หน่วยงานต้องอ้างวันที่ระเบียบฉบับนี้เริ่มมีผลในหนังสือเวียน ควรระบุวันใด","14 พฤษภาคม 2562",["13 พฤษภาคม 2562","19 เมษายน 2562","1 ตุลาคม 2562"],"ลงราชกิจจานุเบกษา 13 พ.ค. 2562 และมีผลในวันถัดไป ส่วน 19 เม.ย. เป็นวันที่ลงนามประกาศ","ข้อ 2",539],
["องค์กรใดไม่อยู่ในความหมายของ “หน่วยงานของรัฐ” ตามระเบียบนี้","บริษัทเอกชนที่รับจ้างหน่วยงานราชการ",["องค์การมหาชน","ทุนหมุนเวียนที่มีฐานะเป็นนิติบุคคล","องค์กรปกครองส่วนท้องถิ่น"],"นิยามครอบคลุมส่วนราชการ รัฐวิสาหกิจ หน่วยงานของรัฐสภาและศาล องค์การมหาชน ทุนหมุนเวียนนิติบุคคล และ อปท. แต่ไม่รวมเอกชน","ข้อ 4",539],
["เงินรายได้ที่หน่วยงานเก็บได้ตามกฎหมายและกฎหมายอนุญาตให้เก็บไว้ใช้จ่ายโดยไม่ต้องส่งคลัง เรียกว่าอะไร","เงินนอกงบประมาณ",["เงินเบิกเกินส่งคืน","เงินงบประมาณเหลือจ่าย","เงินเหลือจ่ายปีเก่าส่งคืน"],"หัวใจคำนิยามคือ “ไม่ต้องนำส่งคลัง” เพราะมีกฎหมายอนุญาต","ข้อ 4",542],
["ผู้รับผิดชอบรักษาการตามระเบียบนี้คือใคร","ปลัดกระทรวงการคลัง",["รัฐมนตรีว่าการกระทรวงการคลัง","อธิบดีกรมบัญชีกลาง","นายกรัฐมนตรี"],"ระเบียบนี้กำหนดให้ปลัดกระทรวงการคลังเป็นผู้รักษาการ","ข้อ 5",542],
["หน่วยงานต้องการแก้แบบทะเบียนคุมที่ใช้ในการเบิกจ่าย ต้องยึดตามที่หน่วยงานใดกำหนด","กรมบัญชีกลาง",["สำนักงบประมาณ","สำนักงานการตรวจเงินแผ่นดิน","สำนักงานเศรษฐกิจการคลัง"],"แบบพิมพ์ เอกสาร ทะเบียนคุม รายงาน และวิธีปฏิบัติ เป็นไปตามที่กรมบัญชีกลางกำหนด","ข้อ 6",542],
["ค่าใช้จ่ายถึงกำหนดจ่ายในเดือนหน้า เจ้าหน้าที่ควรขอเบิกเมื่อใด","เมื่อถึงกำหนดหรือใกล้ถึงกำหนดจ่ายเงิน",["ขอเบิกล่วงหน้าทันทีที่ทำสัญญา","ขอเบิกตั้งแต่ต้นปีงบประมาณ","ขอเบิกเมื่อสิ้นปีงบประมาณ"],"ห้ามขอเบิกเงินจนกว่าจะถึงกำหนดหรือใกล้ถึงกำหนดจ่ายเงิน ใช้กับการเบิกทุกกรณี","ข้อ 22",524],
["รายการใดเมื่อค้างเบิกแล้วนำมาเบิกจากงบกลางรายการเดียวกันของปีงบประมาณต่อ ๆ ไปได้","บำเหน็จบำนาญ",["ค่าครุภัณฑ์สำนักงาน","ค่าจ้างเหมาก่อสร้าง","ค่าวัสดุสำนักงาน"],"ค่าใช้จ่ายงบกลาง เช่น เบี้ยหวัด บำเหน็จ บำนาญ ค่ารักษาพยาบาล ถ้าค้างเบิกนำไปเบิกงบกลางรายการนั้นของปีต่อ ๆ ไปได้","ข้อ 24",524],
["ค่าใช้จ่ายประจำตามประเภทที่กระทรวงการคลังกำหนด ถือว่าเกิดขึ้นเมื่อใด","เมื่อส่วนราชการได้รับแจ้งให้ชำระหนี้",["เมื่อเริ่มต้นปีงบประมาณ","เมื่อลงนามในสัญญา","เมื่อจ่ายเงินให้เจ้าหนี้แล้ว"],"จึงเบิกจากงบรายจ่ายประจำปีที่ได้รับแจ้งให้ชำระหนี้","ข้อ 25",524],
["ส่วนราชการจะสั่งจ่ายเช็คเพื่อขอรับเงินสดมาจ่าย ต้องออกเช็คอย่างไร","สั่งจ่ายในนามเจ้าหน้าที่การเงินของส่วนราชการ และขีดฆ่าคำว่า “หรือผู้ถือ”",["สั่งจ่าย “เงินสด” และไม่ต้องขีดฆ่า","สั่งจ่ายในนามหัวหน้าส่วนราชการ และขีดคร่อม","ลงลายมือชื่อไว้ล่วงหน้า แล้วเติมจำนวนเงินภายหลัง"],"ห้ามออกเช็คสั่งจ่ายเงินสด และห้ามลงลายมือชื่อในเช็คล่วงหน้า","ข้อ 53",529],
["การจ่ายให้เจ้าหนี้ค่าซื้อทรัพย์สินด้วยเช็ค ต้องเขียนเช็คอย่างไร","สั่งจ่ายในนามเจ้าหนี้ ขีดฆ่า “หรือผู้ถือ” และขีดคร่อม",["สั่งจ่ายในนามเจ้าหนี้โดยไม่ต้องขีดฆ่าหรือขีดคร่อม","สั่งจ่ายเงินสดแล้วมอบให้เจ้าหนี้","สั่งจ่ายในนามเจ้าหน้าที่การเงิน"],"กรณีซื้อทรัพย์สิน จ้างทำของ หรือเช่าทรัพย์สิน ต้องขีดฆ่าและขีดคร่อมด้วย กรณีอื่นจะขีดคร่อมหรือไม่ก็ได้","ข้อ 53",529],
["นาย ก. ยังคืนเงินยืมรายเดิมไม่เสร็จ แต่ขอยืมรายใหม่ ผู้อนุมัติควรทำอย่างไร","ไม่อนุมัติจนกว่ารายเก่าจะชำระเสร็จสิ้น",["อนุมัติได้ถ้ายอดไม่เกินรายเดิม","อนุมัติได้ถ้าหัวหน้างานรับรอง","อนุมัติแล้วหักจากเงินเดือนภายหลัง"],"ห้ามอนุมัติให้ยืมรายใหม่เมื่อผู้ยืมยังไม่ชำระคืนเงินยืมรายเก่าให้เสร็จสิ้น","ข้อ 59",529],
["สัญญาการยืมเงินต้องจัดทำกี่ฉบับ และใครเก็บ","2 ฉบับ ส่วนราชการผู้ให้ยืมเก็บ 1 ฉบับ ผู้ยืมเก็บ 1 ฉบับ",["1 ฉบับ เก็บที่ส่วนราชการผู้ให้ยืม","2 ฉบับ เก็บที่กองคลังทั้งคู่","3 ฉบับ ส่งกรมบัญชีกลาง 1 ฉบับ"],"ส่วนราชการผู้ให้ยืมเก็บเป็นหลักฐานหนึ่งฉบับ และผู้ยืมเก็บหนึ่งฉบับ","ข้อ 61",529],
["ครบกำหนดแล้วผู้ยืมยังไม่คืนเงินยืม ใครต้องเรียกชดใช้ และภายในกี่วัน","ผู้อำนวยการกองคลัง ภายใน 30 วันนับแต่วันครบกำหนด",["หัวหน้าส่วนราชการ ภายใน 15 วัน","เจ้าหน้าที่การเงิน ภายใน 7 วัน","ผู้อำนวยการกองคลัง ภายใน 60 วัน"],"ผู้อำนวยการกองคลังต้องเรียกชดใช้ตามเงื่อนไขในสัญญาให้เสร็จสิ้นโดยเร็ว อย่างช้าไม่เกิน 30 วัน","ข้อ 68",550],
["เจ้าหน้าที่จ่ายเงินสดให้ผู้ขายแล้ว ต้องประทับข้อความใดบนหลักฐานการจ่าย","“จ่ายเงินแล้ว” พร้อมลงลายมือชื่อ ชื่อตัวบรรจง และวันที่จ่าย",["“รับเงินแล้ว” พร้อมลงลายมือชื่อ","“ตรวจจ่ายแล้ว” โดยไม่ต้องลงวันที่","“ชำระเงินแล้ว” โดยผู้รับเงิน"],"เพื่อประโยชน์ในการตรวจสอบ ต้องมีทั้งตรา ลายมือชื่อ ชื่อตัวบรรจง และวัน เดือน ปี","ข้อ 42",546],
["ผู้ขายต่างชาติออกหลักฐานการจ่ายเป็นภาษาอังกฤษ ต้องมีสิ่งใดเพิ่ม","คำแปลเป็นภาษาไทย",["หนังสือรับรองจากสถานทูต","ใบรับรองการจ่าย","ลายมือชื่อหัวหน้าส่วนราชการ"],"หลักฐานการจ่ายที่เป็นภาษาต่างประเทศต้องมีคำแปลเป็นภาษาไทย","ข้อ 42 วรรคสอง",546],
["รายการใดไม่จำเป็นต้องปรากฏในใบเสร็จรับเงินที่ผู้รับเงินออกให้","ลายมือชื่อของผู้จ่ายเงิน",["ลายมือชื่อของผู้รับเงิน","จำนวนเงินทั้งตัวเลขและตัวอักษร","รายการที่ระบุว่าเป็นค่าอะไร"],"ใบเสร็จต้องมีชื่อที่อยู่ผู้รับเงิน วันที่ รายการ จำนวนเงิน และลายมือชื่อผู้รับเงิน","ข้อ 46",546],
["ใบเสร็จรับเงินแต่ละฉบับต้องมีสำเนาติดเล่มอย่างน้อยกี่ฉบับ","1 ฉบับ",["2 ฉบับ","3 ฉบับ","ไม่ต้องมีสำเนา"],"กำหนดให้มีสำเนาเย็บติดกับเล่มอย่างน้อยหนึ่งฉบับ","ข้อ 69",550],
["ในราชการบริหารส่วนกลาง เมื่อสิ้นปีงบประมาณ หัวหน้าหน่วยงานที่รับใบเสร็จไปต้องรายงานเล่มและเลขที่ใบเสร็จต่อใคร","ผู้อำนวยการกองคลัง",["สำนักงานการตรวจเงินแผ่นดิน","กรมบัญชีกลาง","ปลัดกระทรวงการคลัง"],"ส่วนภูมิภาครายงานหัวหน้าส่วนราชการ ส่วนกลางรายงานผู้อำนวยการกองคลัง","ข้อ 74",550],
["ตู้นิรภัยมีลูกกุญแจ 3 ดอก แต่มีกรรมการเก็บรักษาเงิน 2 คน ลูกกุญแจดอกที่เหลือให้ทำอย่างไร","ให้อยู่ในดุลพินิจของหัวหน้าส่วนราชการที่จะมอบให้กรรมการผู้ใดถือ",["กรรมการที่อาวุโสกว่าถือ 2 ดอกเสมอ","หัวหน้าส่วนราชการต้องถือเอง","ฝากไว้ที่ธนาคาร"],"กรรมการถือคนละหนึ่งดอก ดอกที่เหลืออยู่ในดุลพินิจของหัวหน้าส่วนราชการ","ข้อ 87",554],
["ลูกกุญแจตู้นิรภัยหาย กรรมการเก็บรักษาเงินต้องรีบรายงานใคร","หัวหน้าส่วนราชการ",["ผู้อำนวยการกองคลัง","เจ้าหน้าที่การเงิน","ปลัดกระทรวงการคลัง"],"ต้องรีบรายงานหัวหน้าส่วนราชการเพื่อสั่งการโดยเร็ว","ข้อ 90",554],
["หน่วยงานผู้เบิกในส่วนภูมิภาครับเงินผ่านระบบ e-Payment แล้วต้องนำส่งคลัง ต้องโอนเข้าบัญชีใด","บัญชีเงินฝากธนาคารของสำนักงานคลังจังหวัด",["บัญชีเงินฝากธนาคารของกรมบัญชีกลาง","บัญชีเงินฝากของหน่วยงานผู้เบิกเอง","บัญชีของธนาคารแห่งประเทศไทย"],"ส่วนกลางเข้าบัญชีกรมบัญชีกลาง ส่วนภูมิภาคเข้าบัญชีสำนักงานคลังจังหวัด","ข้อ 103",558],
["หน่วยงานก่อหนี้ผูกพันก่อนสิ้นปีงบประมาณ แต่เบิกไม่ทัน ต้องทำอย่างไร","ขอกันเงินไว้เบิกเหลื่อมปี",["ขอเงินยืมไว้เบิกเหลื่อมปี","ขอขยายปีงบประมาณ","ยกเลิกสัญญาแล้วทำใหม่"],"การกันเงินใช้กับหนี้ที่ผูกพันไว้ก่อนสิ้นปีงบประมาณ และมีวงเงินตั้งแต่ 100,000 บาทขึ้นไป","ข้อ 105",558],
["ระเบียบฯ เบิกเงินจากคลัง พ.ศ. 2562 ยกเลิกระเบียบเดิม ข้อใดไม่อยู่ในรายการที่ถูกยกเลิก","ระเบียบการเบิกจ่ายเงินจากคลัง การเก็บรักษาเงินและการนำเงินส่งคลัง (ฉบับที่ 3) พ.ศ. 2562",["ระเบียบการเบิกจ่ายเงินจากคลัง การเก็บรักษาเงินและการนำเงินส่งคลัง พ.ศ. 2551", "ระเบียบการเบิกจ่ายเงินจากคลัง การเก็บรักษาเงินและการนำเงินส่งคลัง (ฉบับที่ 2) พ.ศ. 2561", "ระเบียบการเก็บรักษาเงินและการนำเงินส่งคลังในหน้าที่ของอำเภอและกิ่งอำเภอ พ.ศ. 2520"],"ยกเลิก 3 ฉบับ คือ ระเบียบปี 2551 ฉบับที่ 2 ปี 2561 และระเบียบของอำเภอและกิ่งอำเภอ ปี 2520 ไม่มีฉบับที่ 3","ข้อ 3","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],
["“ส่วนราชการ” ตามระเบียบนี้ หมายความรวมถึงข้อใด","จังหวัดและกลุ่มจังหวัด",["อำเภอและกิ่งอำเภอ", "องค์กรปกครองส่วนท้องถิ่น", "รัฐวิสาหกิจที่ได้รับงบประมาณ"],"ส่วนราชการ คือ กระทรวง ทบวง กรม หรือส่วนราชการที่มีฐานะเป็นกรม และรวมถึงจังหวัดและกลุ่มจังหวัด","ข้อ 4","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],
["หน่วยงานของรัฐที่ได้รับจัดสรรงบประมาณรายจ่ายและเบิกเงินจากกรมบัญชีกลางหรือสำนักงานคลังจังหวัด เรียกว่าอะไร","หน่วยงานผู้เบิก",["หน่วยงานย่อย", "หน่วยงานผู้จ่าย", "หน่วยรับงบประมาณ"],"ถ้าไม่ได้เบิกจากกรมบัญชีกลางหรือคลังจังหวัดเอง แต่เบิกผ่านหน่วยงานผู้เบิก เรียกว่า หน่วยงานย่อย","ข้อ 4","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],
["“หน่วยงานย่อย” เบิกเงินผ่านหน่วยงานใด","ส่วนราชการที่เป็นหน่วยงานผู้เบิก",["กรมบัญชีกลางโดยตรง", "สำนักงานคลังจังหวัดโดยตรง", "ธนาคารแห่งประเทศไทย"],"หน่วยงานย่อยมิได้เบิกเงินจากกรมบัญชีกลางหรือสำนักงานคลังจังหวัด แต่เบิกผ่านส่วนราชการที่เป็นหน่วยงานผู้เบิก","ข้อ 4","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],
["หลักฐานที่แสดงว่าได้จ่ายเงินให้แก่ผู้รับหรือเจ้าหนี้ตามข้อผูกพันโดยถูกต้องแล้ว เรียกว่าอะไร","หลักฐานการจ่าย",["หลักฐานการรับ", "หลักฐานรายจ่าย", "หลักฐานการเบิก"],"เป็นคำนิยามในข้อ 4","ข้อ 4","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],
["เงินที่ส่วนราชการจ่ายให้บุคคลใดยืม เพื่อเป็นค่าใช้จ่ายเดินทางไปราชการหรือปฏิบัติราชการอื่น ไม่ว่าจ่ายจากเงินงบประมาณหรือเงินนอกงบประมาณ เรียกว่าอะไร","เงินยืม",["เงินทดรองราชการ", "เงินกู้ยืม", "เงินทดลองจ่าย"],"เงินทดรองราชการเป็นเงินที่ส่วนราชการได้รับไว้สำรองจ่าย คนละความหมายกับเงินยืม","ข้อ 4","ตัวบทระเบียบฯ ราชกิจจาฯ 13 พ.ค. 2562"],

["รัฐต้องดำเนินนโยบายการคลังและการก่อหนี้ตามคุณลักษณะข้อใด","มีประสิทธิภาพ โปร่งใส และตรวจสอบได้",["รวดเร็ว ประหยัด และเป็นความลับ","มั่นคง มั่งคั่ง และยั่งยืน","คุ้มค่า รวดเร็ว และเป็นธรรม"],"มาตรา 6 กำหนดไว้ พร้อมหลักรักษาเสถียรภาพ พัฒนาเศรษฐกิจอย่างยั่งยืน และความเป็นธรรมในสังคม","มาตรา 6",462],

["พนักงานเจ้าหน้าที่ที่รัฐมนตรีว่าการกระทรวงการคลังมอบหมายให้ตรวจบัญชีและเอกสารของหน่วยรับงบประมาณ ถือเป็นเจ้าพนักงานตามกฎหมายใด","ประมวลกฎหมายอาญา",["ประมวลรัษฎากร", "ประมวลกฎหมายวิธีพิจารณาความอาญา", "พระราชบัญญัติวินัยการเงินการคลังของรัฐ"],"มาตรา 37 วรรคสองบัญญัติไว้ชัด หลักเดียวกับพนักงานเจ้าหน้าที่ที่ผู้อำนวยการมอบหมายตามมาตรา 21 และ 22","มาตรา 37 วรรคสอง","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.515"],
["ใครมีหน้าที่กำกับหรือควบคุมให้หน่วยรับงบประมาณใช้จ่ายภายในวงเงินที่ได้รับจัดสรร","รัฐมนตรีเจ้าสังกัด รัฐมนตรีผู้กำกับ หรือผู้รักษาการตามกฎหมาย แล้วแต่กรณี",["ผู้ว่าการตรวจเงินแผ่นดินเท่านั้น", "อธิบดีกรมบัญชีกลางเท่านั้น", "ผู้อำนวยการสำนักงบประมาณเท่านั้น"],"กรณีหน่วยงานของรัฐสภา ศาล องค์กรอิสระ และองค์กรอัยการ คือผู้รักษาการตามกฎหมาย","มาตรา 38","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.516"],
["หน่วยงานของศาลและองค์กรอิสระตามรัฐธรรมนูญ ใครมีหน้าที่กำกับการใช้จ่ายงบประมาณ","ผู้รักษาการตามกฎหมาย",["นายกรัฐมนตรี", "คณะรัฐมนตรี", "รัฐมนตรีว่าการกระทรวงการคลัง"],"ใช้กับหน่วยงานของรัฐสภา ศาลยุติธรรม ศาลปกครอง ศาลรัฐธรรมนูญ องค์กรอิสระ และองค์กรอัยการ","มาตรา 38","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.516"],
["หน่วยรับงบประมาณจะจ่ายเงินหรือก่อหนี้ผูกพันได้ ต้องเป็นไปตามข้อใด","แผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ",["แผนปฏิบัติราชการเพียงอย่างเดียว", "ความเห็นของหัวหน้าหน่วยรับงบเพียงอย่างเดียว", "ยอดเงินที่เหลือในบัญชีของหน่วยงาน"],"และต้องได้รับอนุมัติเงินจัดสรรจากผู้อำนวยการก่อน","มาตรา 40","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.516"],
["รายจ่ายใดจ่ายหรือก่อหนี้ผูกพันได้ โดยไม่ต้องรออนุมัติเงินจัดสรรจากผู้อำนวยการ","งบประมาณรายจ่ายบุคลากร",["งบลงทุนก่อสร้างอาคาร", "ค่าครุภัณฑ์สำนักงาน", "ค่าจ้างที่ปรึกษา"],"อีกกรณีคือรายจ่ายที่ผู้อำนวยการกำหนดโดยความเห็นชอบของคณะรัฐมนตรี","มาตรา 40 วรรคสอง","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.516"],
["รายการที่ต้องก่อหนี้ผูกพันข้ามปีงบประมาณ ผู้อำนวยการรวบรวมเสนอใครพิจารณาอนุมัติ","คณะรัฐมนตรี",["นายกรัฐมนตรี", "รัฐมนตรีว่าการกระทรวงการคลัง", "รัฐสภา"],"ต้องเสนอภายใน 60 วันนับแต่วันที่กฎหมายว่าด้วยงบประมาณรายจ่ายใช้บังคับ","มาตรา 41","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.516"],
["ผู้อำนวยการต้องเสนอรายการก่อหนี้ผูกพันข้ามปีต่อคณะรัฐมนตรีภายในกี่วันนับแต่กฎหมายงบรายจ่ายใช้บังคับ","60 วัน",["30 วัน", "45 วัน", "90 วัน"],"คณะรัฐมนตรีเป็นผู้อนุมัติการก่อหนี้ผูกพัน","มาตรา 41","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.517"],
["กรณีจำเป็นเร่งด่วน ใครอนุมัติให้หน่วยรับงบก่อหนี้ผูกพันเกินหรือนอกเหนือจากที่กำหนดในกฎหมายงบรายจ่ายได้","คณะรัฐมนตรี",["นายกรัฐมนตรี", "รัฐมนตรีว่าการกระทรวงการคลัง", "ผู้อำนวยการสำนักงบประมาณ"],"ใช้กับกรณีที่ไม่ใช่การก่อหนี้ผูกพันข้ามปีงบประมาณ","มาตรา 42","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.517"],
["หน่วยรับงบเบิกเงินจากคลังไม่ทันภายในปีงบประมาณ ขอขยายเวลาเบิกได้อีกไม่เกินเท่าใดของปีงบประมาณถัดไป","6 เดือน",["3 เดือน", "4 เดือน", "1 ปี"],"ขยายได้เฉพาะเมื่อก่อหนี้ผูกพันไว้ก่อนสิ้นปีงบประมาณและกันเงินไว้แล้ว ถ้ายังไม่พอต้องทำความตกลงกับกระทรวงการคลัง","มาตรา 43 วรรคสองและวรรคสาม","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.517"],
["ขยายเวลาเบิกเงินจากคลังครบ 6 เดือนแล้วยังจำเป็นต้องเบิกอีก ต้องทำอย่างไร","ทำความตกลงกับกระทรวงการคลังเพื่อขยายได้อีกไม่เกิน 6 เดือน",["ขออนุมัติผู้อำนวยการขยายได้อีกไม่เกิน 3 เดือน", "ขออนุมัติคณะรัฐมนตรีขยายได้อีกไม่เกิน 1 ปี", "เบิกไม่ได้อีกแล้ว ต้องตั้งงบใหม่"],"ขยายครั้งแรกได้ไม่เกิน 6 เดือนของปีงบประมาณถัดไป ถ้าเกินกว่านั้นต้องทำความตกลงกับกระทรวงการคลังขยายได้อีกไม่เกิน 6 เดือน","มาตรา 43 วรรคสาม","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.517"],
["งบรายจ่ายข้ามปีที่ก่อหนี้ผูกพันก่อนสิ้นกำหนดเวลาและกันเงินไว้แล้ว ขยายเวลาเบิกจากคลังได้อีกเท่าใด","ไม่เกิน 6 เดือน",["ไม่เกิน 3 เดือน", "ไม่เกิน 4 เดือน", "ไม่เกิน 1 ปี"],"ถ้ายังไม่พอ ทำความตกลงกับกระทรวงการคลังขยายได้อีกไม่เกิน 6 เดือน","มาตรา 44","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.517"],
["งบรายจ่ายข้ามปีที่ขยายเวลาเบิกครบ 6 เดือนแล้ว หากยังต้องเบิก ทำความตกลงกับกระทรวงการคลังขยายได้อีกเท่าใด","ไม่เกิน 6 เดือน",["ไม่เกิน 2 เดือน", "ไม่เกิน 3 เดือน", "ไม่เกิน 12 เดือน"],"ใช้หลักเดียวกับการขยายเวลาเบิกจ่ายตามมาตรา 43","มาตรา 44","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.518"],
["เงินที่รัฐมนตรีว่าการกระทรวงการคลังจ่ายจากคลังได้เมื่อจำเป็นเร่งด่วน และงบกลางรายการเงินสำรองจ่ายฯ ไม่เพียงพอ เรียกว่าอะไร","เงินทุนสำรองจ่าย",["เงินทุนหมุนเวียน", "เงินคงคลัง", "เงินนอกงบประมาณ"],"มีจำนวน 50,000 ล้านบาท","มาตรา 45","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.518"],
["การจ่ายเงินทุนสำรองจ่ายต้องได้รับอนุมัติจากใคร","คณะรัฐมนตรี",["นายกรัฐมนตรี", "สภาผู้แทนราษฎร", "รัฐสภา"],"และต้องตั้งงบชดใช้ในโอกาสแรก","มาตรา 45","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.518"],
["เมื่อสิ้นปีงบประมาณ ใครประกาศรายงานการรับจ่ายเงินงบประมาณและเงินทุนสำรองจ่ายในราชกิจจานุเบกษา","รัฐมนตรีว่าการกระทรวงการคลัง",["ผู้อำนวยการสำนักงบประมาณ", "คณะรัฐมนตรี", "นายกรัฐมนตรี"],"ต้องประกาศภายใน 60 วัน","มาตรา 49","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.519"],
["รายงานการรับจ่ายเงินงบประมาณและเงินทุนสำรองจ่าย ต้องประกาศในราชกิจจานุเบกษาภายในกี่วัน","60 วัน",["30 วัน", "90 วัน", "120 วัน"],"นับแต่วันสิ้นปีงบประมาณ","มาตรา 49","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.519"],
["หน่วยรับงบต้องรายงานผลการใช้จ่ายงบประมาณและผลการปฏิบัติงานต่อผู้อำนวยการภายในกี่วันนับแต่วันสิ้นปีงบประมาณ","45 วัน",["30 วัน", "60 วัน", "90 วัน"],"จากนั้นผู้อำนวยการรายงานต่อคณะรัฐมนตรีภายใน 90 วัน","มาตรา 50","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.519"],
["ผู้อำนวยการต้องรายงานผลการใช้จ่ายงบประมาณของหน่วยรับงบต่อคณะรัฐมนตรีภายในกี่วันนับแต่วันสิ้นปีงบประมาณ","90 วัน",["30 วัน", "45 วัน", "60 วัน"],"หน่วยรับงบต้องส่งให้ผู้อำนวยการก่อนภายใน 45 วัน","มาตรา 50","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.519"],
["รายงานการโอนงบกลางระหว่างรายการ หรือการโอนงบบูรณาการและงบบุคลากรระหว่างหน่วยรับงบ ผู้อำนวยการต้องเสนอคณะรัฐมนตรีเพื่อรายงานรัฐสภาภายในกี่วัน","30 วัน",["45 วัน", "60 วัน", "90 วัน"],"นับแต่วันสิ้นปีงบประมาณ","มาตรา 51","แนวข้อสอบ พ.ร.บ.วิธีการงบประมาณ น.519"],
]},

["“แผนการใช้จ่ายงบประมาณ” ตามระเบียบนี้หมายความว่าอะไร","แผนแสดงรายละเอียดการใช้จ่ายงบประมาณสำหรับหน่วยรับงบประมาณ เพื่อดำเนินงานตามแผนการปฏิบัติงานในรอบปีงบประมาณ",["แผนแสดงรายละเอียดการใช้จ่ายงบประมาณสำหรับหน่วยรับงบประมาณ เพื่อดำเนินงานตามแผนการปฏิบัติงานในรอบปีปฏิทิน", "แผนแสดงรายละเอียดการใช้จ่ายงบประมาณสำหรับหน่วยรับตรวจ เพื่อดำเนินงานตามแผนการปฏิบัติงานในรอบปีงบประมาณ", "แผนแสดงรายละเอียดการจัดสรรงบประมาณของสำนักงบประมาณให้หน่วยรับงบประมาณในรอบปีงบประมาณ"],"คู่กับแผนการปฏิบัติงาน ใช้รอบปีงบประมาณเหมือนกัน","ข้อ 3","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],

["แบบแผนการปฏิบัติงาน แผนการใช้จ่ายงบประมาณ และแบบรายงานการโอนหรือเปลี่ยนแปลงเงินจัดสรร เป็นไปตามที่หน่วยงานใดกำหนด","สำนักงบประมาณ",["กระทรวงการคลัง", "กรมบัญชีกลาง", "สำนักงานการตรวจเงินแผ่นดิน"],"ระวังสับสนกับระเบียบเบิกจ่ายเงินจากคลัง ซึ่งแบบพิมพ์เป็นไปตามที่กรมบัญชีกลางกำหนด","ข้อ 5","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],

["ได้รับอนุมัติเงินจัดสรรแล้ว และต้องส่งเงินจัดสรรต่อไปยังสำนักงานในส่วนภูมิภาค ต้องดำเนินการภายในกี่วัน","ภายใน 15 วันนับแต่วันที่ได้รับอนุมัติเงินจัดสรร",["ภายใน 10 วันนับแต่วันที่ได้รับอนุมัติเงินจัดสรร", "ภายใน 30 วันนับแต่วันที่ได้รับอนุมัติเงินจัดสรร", "ภายใน 15 วันทำการนับแต่วันเริ่มปีงบประมาณ"],"ให้เร่งดำเนินการเพื่อให้ส่วนภูมิภาคเบิกจ่ายได้","ข้อ 21","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["หน่วยรับงบประมาณโอนหรือเปลี่ยนแปลงเงินจัดสรรได้เองแล้ว ต้องส่งรายงานตามแบบที่สำนักงบประมาณกำหนดภายในกี่วัน","ภายใน 15 วันนับแต่วันที่มีการโอนหรือเปลี่ยนแปลงเงินจัดสรร",["ภายใน 10 วันนับแต่วันที่มีการโอนหรือเปลี่ยนแปลง", "ภายใน 30 วันนับแต่วันที่มีการโอนหรือเปลี่ยนแปลง", "ภายใน 15 วันนับแต่วันสิ้นไตรมาส"],"ใช้กับกรณีที่ไม่ต้องขอทำความตกลงกับสำนักงบประมาณ","ข้อ 29","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["สำนักงบประมาณอนุมัติเงินจัดสรรงบกลางตามรายการที่ระเบียบกำหนดให้หน่วยงานใด","กรมบัญชีกลาง",["หน่วยรับงบประมาณทุกแห่ง", "สำนักนายกรัฐมนตรี", "สำนักงานคลังจังหวัด"],"เช่น เงินเบี้ยหวัด บำเหน็จ บำนาญ และค่ารักษาพยาบาลข้าราชการ","ข้อ 30","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["งบกลางรายการใดที่ให้โอนไปตั้งจ่ายในงบประมาณรายจ่ายบุคลากรของหน่วยรับงบประมาณ","เงินเลื่อนเงินเดือนและเงินปรับวุฒิข้าราชการ",["เงินเบี้ยหวัด บำเหน็จ บำนาญ", "เงินสมทบของลูกจ้างประจำ", "ค่าใช้จ่ายในการรักษาพยาบาลของข้าราชการ"],"รายการอื่นเบิกจ่ายโดยตรงกับกรมบัญชีกลาง","ข้อ 30 วรรคสอง","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["ข้อใดเป็นรายการงบกลางที่เบิกจ่ายโดยตรงกับกรมบัญชีกลางได้","ค่าใช้จ่ายชดใช้เงินทดรองราชการเพื่อช่วยเหลือผู้ประสบภัยพิบัติกรณีฉุกเฉิน",["เงินเลื่อนเงินเดือนและเงินปรับวุฒิข้าราชการ", "เงินสำรองจ่ายเพื่อกรณีฉุกเฉินหรือจำเป็น", "ค่าใช้จ่ายเกี่ยวกับการเสด็จพระราชดำเนินและต้อนรับประมุขต่างประเทศ"],"รายการเบิกตรง เช่น บำเหน็จบำนาญ เงินช่วยเหลือ เงินสำรอง เงินสมทบ เงินชดเชย รักษาพยาบาล ปรับค่าตอบแทนบุคลากร และชดใช้เงินทดรองราชการ","ข้อ 30 วรรคสอง","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["หน่วยรับงบประมาณจำเป็นต้องขอรับจัดสรรงบกลางรายการอื่นนอกจากที่กรมบัญชีกลางได้รับตามข้อ 30 ต้องทำอย่างไร","ขอทำความตกลงกับสำนักงบประมาณ",["ขอทำความตกลงกับกระทรวงการคลัง", "ขอความเห็นชอบจากผู้มีอำนาจกำกับแผนงานบูรณาการ", "ขออนุมัติจากหัวหน้าหน่วยรับงบประมาณ"],"ถ้าจะใช้สมทบในแผนงานบูรณาการ ต้องขอความเห็นชอบจากผู้มีอำนาจกำกับแผนงานบูรณาการ","ข้อ 31","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["ยื่นคำของบกลางนอกจากรายการของกรมบัญชีกลาง เพื่อสมทบใช้ในแผนงานบูรณาการ ต้องทำอย่างไร","ขอความเห็นชอบจากผู้มีอำนาจกำกับแผนงานบูรณาการ",["ขอทำความตกลงกับสำนักงบประมาณ", "ขอทำความตกลงกับกระทรวงการคลัง", "ขอความเห็นชอบจากหัวหน้าหน่วยรับงบประมาณที่เป็นเจ้าภาพหลัก"],"ใช้เมื่อนำไปใช้จ่ายบรรลุวัตถุประสงค์แล้ว หรือจัดซื้อจัดจ้างแล้วมีเหลือจ่าย หรือคาดการณ์ได้แน่ชัดว่าจะเหลือ","ข้อ 32","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["งบกลางที่หน่วยรับงบประมาณได้รับจัดสรรแล้วมีเหลือจ่าย หรือคาดได้แน่ชัดว่าจะเหลือ ต้องแจ้งคืนสำนักงบประมาณภายในกี่วัน","ภายใน 15 วันนับแต่วันที่ทราบยอดงบประมาณเหลือจ่าย",["ภายใน 10 วันนับแต่วันที่ทราบยอด", "ภายใน 30 วันนับแต่วันที่ทราบยอด", "ภายใน 15 วันนับแต่วันสิ้นปีงบประมาณ"],"นับจากวันที่ทราบยอด ไม่ใช่วันสิ้นปี","ข้อ 33 วรรคสอง","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],

["เจ้าภาพหลักต้องรายงานผลการปฏิบัติงานและผลการใช้จ่ายของแผนงานบูรณาการให้สำนักงบประมาณภายในเวลาใด","ภายใน 15 วันนับแต่วันสิ้นไตรมาส",["ภายใน 15 วันนับแต่วันสิ้นเดือน", "ภายใน 30 วันนับแต่วันสิ้นไตรมาส", "ภายใน 45 วันนับแต่วันสิ้นไตรมาส"],"ใช้กรอบเวลาเดียวกับรายงานรายไตรมาสของหน่วยรับงบทั่วไป","ข้อ 35","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["สำนักงบประมาณรวบรวมรายงานผลการปฏิบัติงานและผลการใช้จ่ายงบประมาณ เสนอต่อใคร และภายในเวลาใด","คณะรัฐมนตรี ภายใน 90 วันนับแต่วันสิ้นปีงบประมาณ",["นายกรัฐมนตรี ภายใน 90 วันนับแต่วันสิ้นปีงบประมาณ", "คณะรัฐมนตรี ภายใน 60 วันนับแต่วันสิ้นปีงบประมาณ", "รัฐสภา ภายใน 90 วันนับแต่วันสิ้นปีงบประมาณ"],"ตรงกับ พ.ร.บ.วิธีการงบประมาณ มาตรา 50","ข้อ 37","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["โดยหลักทั่วไป หน่วยรับงบประมาณต้องยื่นคำขออนุมัติเงินจัดสรรงบประมาณรายจ่ายประจำปีหรือไม่","ไม่ต้องยื่น สำนักงบประมาณจะอนุมัติเงินจัดสรรให้สอดคล้องกับแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณ",["ต้องยื่นคำขอทุกไตรมาส", "ต้องยื่นคำขอก่อนวันเริ่มปีงบประมาณไม่น้อยกว่า 15 วัน", "ไม่ต้องยื่น กรมบัญชีกลางจะอนุมัติเงินจัดสรรให้ตามแผน"],"แต่กรณีงบเพิ่มเติมหรืองบที่โอนมาจากหน่วยรับงบอื่น สำนักงบประมาณอาจกำหนดให้ต้องยื่นคำขอก็ได้","ข้อ 18","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["การปฏิบัตินอกเหนือไปจากที่กำหนดไว้ในระเบียบว่าด้วยการบริหารงบประมาณ ต้องทำอย่างไร","ขอทำความตกลงกับสำนักงบประมาณ",["ขอทำความตกลงกับกระทรวงการคลัง", "ขออนุมัติจากคณะรัฐมนตรี", "ขอความเห็นชอบจากรัฐมนตรีเจ้าสังกัด"],"เป็นหลักทั่วไปในหมวด 1","ข้อ 7","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],
["การปรับแผนการปฏิบัติงานและแผนการใช้จ่ายงบประมาณของหน่วยรับงบประมาณ (ที่ไม่ใช่บูรณาการ) ต้องเสนอใครให้ความเห็นชอบในหลักการก่อนส่งสำนักงบประมาณ","รัฐมนตรีเจ้าสังกัด หรือรัฐมนตรีที่กำกับดูแล หรือรัฐมนตรีผู้รักษาการตามกฎหมาย",["ผู้อำนวยการสำนักงบประมาณ", "คณะรัฐมนตรี", "หัวหน้าหน่วยรับงบประมาณ"],"ถ้าเป็นแผนบูรณาการ ให้เสนอผู้มีอำนาจกำกับแผนงานบูรณาการผ่านเจ้าภาพหลัก","ข้อ 16 (1)","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],

["การโอนงบประมาณรายจ่ายหรือโอนเงินจัดสรรจากแผนงานหนึ่งไปตั้งจ่ายในแผนงานอื่น ทำได้ในกรณีใด","โอนระหว่างแผนงานพื้นฐาน หรือแผนงานยุทธศาสตร์ ภายในหน่วยรับงบประมาณเดียวกัน โดยขอทำความตกลงกับสำนักงบประมาณ",["โอนระหว่างแผนงานใดก็ได้ โดยหัวหน้าหน่วยรับงบประมาณอนุมัติ", "โอนจากแผนงานบุคลากรภาครัฐไปแผนงานพื้นฐาน โดยไม่ต้องขอทำความตกลง", "โอนระหว่างแผนงานพื้นฐานของต่างหน่วยรับงบประมาณ โดยขอทำความตกลงกับกรมบัญชีกลาง"],"เว้นแต่จะมีกฎหมายบัญญัติไว้เป็นอย่างอื่น","ข้อ 26","ตัวบทระเบียบ (ประกาศ 31 ก.ค. 2562)"],

  ["ระดับชำนาญการ",4000,"#f07a2e"],["ระดับชำนาญการพิเศษ",6000,"#e2557f"],["ระดับเชี่ยวชาญ",9000,"#9a6cf0"],["ระดับทรงคุณวุฒิ",13000,"#6a3fd8"],["ตำนานนักสอบ",20000,"#c9930a"]];
const rankIdx=(xp=P.xp)=>{let i=0;RANKS.forEach((r,k)=>{if(xp>=r[1])i=k});return i};
function rankInfo(xp=P.xp){const i=rankIdx(xp),r=RANKS[i],n=RANKS[i+1];
  return {i,name:r[0],color:r[2],next:n,need:n?n[1]-xp:0,pct:n?Math.round((xp-r[1])/(n[1]-r[1])*100):100}}
function medal(i,size=48){const c=RANKS[i][2];

/* ---- สถานะ ---- */
const blankImp=(law=null,mode="one")=>({title:"",text:"",law,mode,q:"",o:["","","",""],a:null,x:""});
const S={dl:"",lawq:"",sec:null,view:"home",law:null,run:null,result:null,filter:"wrong",err:"",confirm:null,imp:blankImp(),q:"",group:"ทั้งหมด"};

function pool(ids,scope){
  const its=allItems().filter(i=>ids.includes(i.law));
  if(scope==="wrong")return its.filter(isWrong);
  if(scope==="new")return its.filter(isNew);
  return its;
}
function start(ids,title,scope,count,mode){
  const p=shuffle(pool(ids,scope)).slice(0,count==="all"?undefined:count);
  if(!p.length)return;
  const qs=p.map(it=>{const idx=it.opts.map((_,i)=>i);return {...it,order:it.fixed?idx:shuffle(idx),pick:null}});
  if(ids.length===1)P.lastLaw=ids[0];
  S.run={title,mode,qs,rank0:rankIdx(),i:0,startedAt:Date.now(),limit:mode==="exam"?qs.length*60:0,confirm:false,combo:0,gained:0};
  go("run");tick();
}
let timer=null;
function tick(){
  clearInterval(timer);
  if(!S.run||S.run.mode!=="exam")return;
  timer=setInterval(()=>{
    if(!S.run)return clearInterval(timer);
    const left=remaining(),el=document.getElementById("clock");
    if(el)el.textContent=clock(left);
    if(left<=0)finish();
  },1000);
}
const remaining=()=>Math.max(0,S.run.limit-Math.floor((Date.now()-S.run.startedAt)/1000));
const clock=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function record(r,q){
  const s=P.s[q.id]||[0,0,0],ok=q.pick===q.a;
  if(ok)s[0]++;else s[1]++;s[2]=ok?1:0;P.s[q.id]=s;
  const k=key(new Date());P.days[k]=(P.days[k]||0)+1;
  let g=ok?10:2;
  if(ok){r.combo++;if(r.combo%5===0)g+=5}else r.combo=0;
  const before=rankIdx();P.xp+=g;r.gained+=g;P.best=Math.max(P.best,streak());
  if(rankIdx()>before)q.rankUp=rankIdx();
}
function pick(n){
  const r=S.run,q=r.qs[r.i],real=q.order[n];
  if(r.mode==="practice"){if(q.pick!==null)return;q.pick=real;record(r,q);save()}
  else q.pick=real;
  render();
}
function finish(){
  clearInterval(timer);
  const r=S.run;
  if(r.mode==="exam")r.qs.forEach(q=>{if(q.pick!==null)record(r,q)});
  const answered=r.qs.filter(q=>q.pick!==null),right=answered.filter(q=>q.pick===q.a).length,n=r.qs.length;
  r.gained+=20;P.xp+=20;
  if(right===n&&n>=10)P.perfect=true;
  if(r.mode==="exam"&&n>=10&&right/n>=.6)P.passed=true;
  P.runs.unshift({t:r.title,r:right,n,m:r.mode,at:Date.now()});P.runs=P.runs.slice(0,50);save();
  S.result={...r,right,answered:answered.length};S.run=null;S.filter=right===n?"all":"wrong";go("result");
}

/* ---- นำเข้า ---- */
function parseImport(text){
  const norm=text.replace(/[๐-๙]/g,c=>"๐๑๒๓๔๕๖๗๘๙".indexOf(c)).replace(/\r/g,"");
  const lines=[];
  norm.split("\n").forEach(l=>{const t=l.trim();if(!t)return;t.split(/\s+(?=[ขคง][.)]\s*\S)/).forEach(x=>lines.push(x.trim()))});
  const out=[],bad=[];let cur=null,last=null;
  const close=()=>{if(!cur)return;
    if(cur.opts.filter(Boolean).length<2||cur.a===null||!cur.opts[cur.a])bad.push(cur.n);
    else out.push({q:cur.q,opts:cur.opts.filter(Boolean),a:cur.opts.slice(0,cur.a).filter(Boolean).length,x:cur.x});cur=null};
  for(const l of lines){
    let m;
    if((m=l.match(/^(?:ข้อ\s*)?(\d+)\s*[.)]\s*(.*)$/))){close();cur={n:m[1],q:m[2],opts:[],a:null,x:""};last="q";continue}
    if(!cur)continue;
    if((m=l.match(/^(?:ตอบ|เฉลย)\s*[:：]?\s*(?:ข้อ\s*)?([กขคง])/))){cur.a=THAI.indexOf(m[1]);last="a";continue}
    if((m=l.match(/^(?:คำ)?อธิบาย\s*[:：]?\s*(.*)$/))){cur.x=m[1];last="x";continue}
    if((m=l.match(/^([กขคง])\s*[.)]\s*(.*)$/))){const i=THAI.indexOf(m[1]);cur.opts[i]=m[2];last=i;continue}
    if(last==="q")cur.q+=" "+l;else if(last==="x")cur.x+=" "+l;else if(typeof last==="number")cur.opts[last]+=" "+l;
  }
  close();return {qs:out,bad};
}
async function store(doc){
  const id="import-"+Date.now();
  try{if(col)await col.doc(id).set(doc)}catch{S.err="บันทึกไม่สำเร็จ ลองอีกครั้ง";render();return false}
  IMPORTS=[...IMPORTS,{...doc,id}];lsSet("exam.imports",IMPORTS);return true;
}
async function saveImport(){
  const m=S.imp,t=m.title.trim(),{qs,bad}=parseImport(m.text);
  if(!m.law&&!t){S.err="ใส่ชื่อชุดข้อสอบก่อนบันทึก";return render()}
  if(!qs.length){S.err="ยังไม่พบข้อสอบที่อ่านได้ ตรวจว่าแต่ละข้อมีเลขข้อ ตัวเลือก และบรรทัด “ตอบ”";return render()}
  if(qs.length>300){S.err="ชุดนี้มีเกิน 300 ข้อ แบ่งเป็นหลายชุดแล้วนำเข้าทีละชุด";return render()}
  if(!await store(m.law?{title:"",law:m.law,qs}:{title:t,qs}))return;
  S.imp=blankImp(m.law,m.mode);S.err=bad.length?`บันทึก ${qs.length} ข้อ ข้าม ${bad.length} ข้อที่ไม่ครบ (ข้อ ${bad.slice(0,10).join(", ")})`:`บันทึก ${qs.length} ข้อแล้ว`;
  render();
}
async function saveOne(){
  const m=S.imp,q=m.q.trim(),o=m.o.map(v=>v.trim()),filled=o.map((v,i)=>[v,i]).filter(x=>x[0]);
  if(!q){S.err="พิมพ์คำถามก่อน";return render()}
  if(filled.length<2){S.err="ใส่ตัวเลือกอย่างน้อย 2 ข้อ";return render()}
  if(m.a===null||!o[m.a]){S.err="แตะตัวอักษรหน้าคำตอบที่ถูก";return render()}
  const doc={title:"",law:m.law,qs:[{q,opts:filled.map(x=>x[0]),a:filled.findIndex(x=>x[1]===m.a),x:m.x.trim()}]};
  if(!await store(doc))return;
  S.imp=blankImp(m.law,"one");S.err=`บันทึกแล้ว ตอนนี้วิชานี้มี ${lawById(m.law).items.length} ข้อ`;
  render();const f=document.getElementById("add-q");if(f)f.focus();
}
async function delImport(id){
  const s=IMPORTS.find(x=>x.id===id),gone=IMPORTS.filter(x=>x.id===id||x.law===id);
  for(const d of gone)try{if(col)await col.doc(d.id).delete()}catch{}
  IMPORTS=IMPORTS.filter(x=>x.id!==id&&x.law!==id);lsSet("exam.imports",IMPORTS);
  if(s&&s.law){S.confirm=null;render()}else go("subjects");
}

function weekChart(){
  const names=["อา","จ","อ","พ","พฤ","ศ","ส"],days=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({l:names[d.getDay()],v:P.days[key(d)]||0})}
  const max=Math.max(P.goal,...days.map(d=>d.v)),W=330,H=150,base=122,top=22,bw=26,step=(W-16)/7;
  const bars=days.map((d,i)=>{const x=8+step*i+(step-bw)/2,h=d.v?Math.max(6,(d.v/max)*(base-top)):0,y=base-h,r=Math.min(4,h);
    return `<g>${d.v?`<path d="M${x} ${base}V${y+r}q0-${r} ${r}-${r}h${bw-2*r}q${r} 0 ${r} ${r}V${base}Z" fill="var(--brand)"/>`:""}
      ${i===6&&d.v?`<text class="v" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${d.v}</text>`:""}
      <text x="${x+bw/2}" y="${base+18}" text-anchor="middle">${d.l}</text>
      <rect x="${8+step*i}" y="0" width="${step}" height="${H}" fill="transparent" data-tip="${d.l}: ${d.v} ข้อ"><title>${d.l}: ${d.v} ข้อ</title></rect></g>`}).join("");
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(days.map(d=>d.l+" "+d.v+" ข้อ").join(", "))}"><line x1="8" x2="${W-8}" y1="${base}" y2="${base}"/>${bars}</svg>`,total:days.reduce((a,d)=>a+d.v,0)};
}

  $app.innerHTML={home:viewHome,subjects:viewSubjects,law:viewLaw,stats:viewStats,profile:viewProfile,run:viewRun,result:viewResult,import:viewImport,statute:viewStatute,ranks:viewRanks}[S.view]();
  if(S.view==="statute")fillStatute();
  const tabbed=TABS.some(t=>t[0]===S.view);
  $tabs.hidden=!tabbed;
  if(tabbed)$tabs.innerHTML=`<div>${TABS.map(([id,l,ic])=>`<button class="tab" data-act="view" data-v="${id}" ${S.view===id?'aria-current="page"':""}>${icon(ic)}${l}</button>`).join("")}</div>`;
  $sheet.innerHTML=viewSheet();
  if(S.view==="import"){const it=document.getElementById("imp-text"),aq=document.getElementById("add-q");if(it)it.value=S.imp.text;if(aq)aq.value=S.imp.q}
}
function go(v){S.view=v;S.err="";S.dl="";S.confirm=null;render();window.scrollTo(0,0)}

/* ---- เหตุการณ์ ---- */
document.addEventListener("click",e=>{
  const tip=e.target.closest("[data-tip]");
  if(tip){const t=document.getElementById("tip");if(t)t.textContent=tip.dataset.tip}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,r=S.run,all=allLaws().map(l=>l.id);
  const jump=i=>{r.i=i;r.confirm=false;render();window.scrollTo(0,0)};
  ({
    view(){if(b.dataset.v==="import"&&S.imp.law)S.imp=blankImp();go(b.dataset.v)},
    statute(){if(S.view!=="statute")S.back=S.view;S.law=b.dataset.id;S.lawq="";S.sec=b.dataset.sec||null;go("statute")},
    unstatute(){go(S.back&&S.back!=="statute"&&(S.back!=="run"||S.run)?S.back:"law")},
    dl(){downloadLaw(b.dataset.id)},
    ranks(){if(S.view!=="ranks")S.rback=S.view;go("ranks")},
    unranks(){go(S.rback&&S.rback!=="ranks"?S.rback:"profile")},
    addto(){S.imp=blankImp(b.dataset.id);go("import")},
    backlaw(){S.law=S.imp.law;go("law")},
    impmode(){S.imp.mode=b.dataset.v;S.err="";render()},
    addans(){S.imp.a=+b.dataset.n;S.err="";render()},
    saveone(){saveOne()},
    law(){S.law=b.dataset.id;go("law")},
    pref(){prefs[b.dataset.k]=b.dataset.k==="count"&&b.dataset.v!=="all"?+b.dataset.v:b.dataset.v;lsSet("exam.prefs",prefs);render()},
    group(){S.group=b.dataset.v;render()},
    goal(){P.goal=+b.dataset.v;save();render()},
    start(){const l=lawById(b.dataset.id);start([l.id],l.short,prefs.scope,prefs.count,prefs.mode)},
    go10(){const l=lawById(b.dataset.id);start([l.id],l.short,"all",10,"practice")},
    mix(){start(all,"สุ่มรวมทุกวิชา","all",10,"practice")},
    mixexam(){start(all,"จำลองสอบรวมทุกวิชา","all",20,"exam")},
    mixwrong(){start(all,"ทบทวนข้อที่ผิด","wrong","all","practice")},
    pick(){pick(+b.dataset.n)},
    next(){jump(r.i+1)},prev(){jump(r.i-1)},jump(){jump(+b.dataset.n)},
    submit(){if(r.qs.some(q=>q.pick===null)){r.confirm=true;render()}else finish()},
    noconfirm(){r.confirm=false;render()},
    finish(){finish()},
    quit(){r.confirmQuit=true;render()},quitno(){r.confirmQuit=false;render()},
    quityes(){clearInterval(timer);S.run=null;save();go("home")},
    filter(){S.filter=b.dataset.v;render()},
    retrywrong(){const w=S.result.qs.filter(q=>q.pick!==q.a);
      S.run={title:S.result.title+" (ข้อที่ผิด)",mode:"practice",rank0:rankIdx(),i:0,startedAt:Date.now(),limit:0,combo:0,gained:0,
        qs:shuffle(w).map(q=>({...q,pick:null,rankUp:0,order:q.fixed?q.order:shuffle(q.order)}))};go("run")},
    saveimp(){saveImport()},
    askdel(){S.confirm=b.dataset.id;render()},nodel(){S.confirm=null;render()},del(){delImport(b.dataset.id)},
  }[a]||(()=>{}))();
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("law")&&d.open)fillLaw(d)},true);
$app.addEventListener("mouseover",e=>{const tip=e.target.closest("[data-tip]");if(tip){const t=document.getElementById("tip");if(t)t.textContent=tip.dataset.tip}});
$app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="imp-title")S.imp.title=t.value;
  if(t.id==="add-q")S.imp.q=t.value;
  if(t.id==="add-x")S.imp.x=t.value;
  if(/^add-o\d$/.test(t.id))S.imp.o[+t.id.slice(5)]=t.value;
  if(t.id==="name"){P.name=t.value.trim();save()}
  if(t.id==="lawq"){S.lawq=t.value;fillStatute()}
  if(t.id==="search"){S.q=t.value;document.getElementById("subjects").innerHTML=subjectCards()}
  if(t.id==="imp-text"){S.imp.text=t.value;const {qs,bad}=parseImport(S.imp.text);
    document.getElementById("imp-count").textContent=`อ่านได้ ${qs.length} ข้อ${bad.length?` · ไม่ครบ ${bad.length} ข้อ`:""}`}
});
document.addEventListener("keydown",e=>{
  if(S.view!=="run"||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const r=S.run,q=r.qs[r.i];
  if(/^[1-9]$/.test(e.key)&&+e.key<=q.order.length){if(r.mode==="exam"||q.pick===null)pick(+e.key-1)}
  else if(e.key==="Enter"&&!e.target.closest("button")){
    if(r.mode==="practice"&&q.pick===null)return;
    if(r.i<r.qs.length-1){r.i++;r.confirm=false;render()}else if(r.mode==="practice")finish();
  }
});
render();
connect();
</script>

</body></html>
